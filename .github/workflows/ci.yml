name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      TZ: UTC
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Check types before generated build files exist
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Build Node server
        run: yarn build
      - name: Install isolated browser-test runtime
        if: runner.os == 'Linux'
        run: yarn playwright install --with-deps chromium
      - name: Test transaction entry in isolated browser contexts
        if: runner.os == 'Linux'
        run: yarn test:e2e
      - name: Ensure installation and checks did not rewrite tracked files
        run: git diff --exit-code
